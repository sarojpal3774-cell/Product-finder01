
<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: white;
            color: black;
            transition: 0.3s;
        }

        /* DARK MODE CLASS */
        .dark {
            background: #111;
            color: white;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>My Website 🌐</h1>

    <p>This is my website.</p>

    <button id="btn">🌙 Dark Mode</button>

    <script>

        let button = document.getElementById("btn");

        button.addEventListener("click", function() {

            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {
                button.textContent = "☀️ Light Mode";
            } else {
                button.textContent = "🌙 Dark Mode";
            }

        });

    </script>

</body>
</html>
