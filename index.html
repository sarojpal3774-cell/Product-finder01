    <title>Product Finder</title>

    <style>

        /* ================= CSS ================= */

        body {
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial;
            background-color: #eeeeee;
            padding-bottom: 80px;
        }


        /* ================= AUTO BANNER ================= */

        .banner {
            width: 95%;
            height: 220px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 20px;
        }

        .slides {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slide 9s infinite;
        }

        .slides img {
            width: 33.333%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes slide {

            0% {
                transform: translateX(0);
            }

            30% {
                transform: translateX(0);
            }

            35% {
                transform: translateX(-33.333%);
            }

            65% {
                transform: translateX(-33.333%);
            }

            70% {
                transform: translateX(-66.666%);
            }

            95% {
                transform: translateX(-66.666%);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* ================= IMG BOX ================= */

        .img-box {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;
            margin: auto;

            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }


        /* ================= CATEGORY ================= */

        .category {
            min-width: 130px;
            text-align: center;
            cursor: pointer;
        }

        .category p {
            font-size: 17px;
            font-weight: bold;
            margin-top: 12px;
            white-space: nowrap;
        }

        .category:hover .img-box {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
    


        /* ================= CATEGORIES ================= */

        .categories {
            padding: 20px;
            display: flex;
            gap: 25px;
            overflow-x: auto;
        }


        /* ================= PRODUCTS ================= */

        .products {
            background-color: white;
            border-radius: 10px;
            padding: 15px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product {
            text-align: center;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }


        /* ================= CART BUTTON ================= */

        .cart {
            font-size: 12px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 18px;
            cursor: pointer;
            margin-top: 10px;
        }


        /* ================= AMOUNT ================= */

        .amount {
            font-size: 16px;
            font-weight: bold;
        }


        /* ================= SUCCESS ================= */

        .success {
            color: green;
            font-weight: bold;
            font-size: 16px;
        }


        /* ================= BOTTOM MENU ================= */

        .bottom-menu {
            position: fixed;
            bottom: 0;
            left: 0;

            width: 100%;

            display: flex;
            justify-content: space-around;

            padding: 10px 0;

            background: white;

            box-shadow: 0 -2px 8px #aaaaaa;
        }

        .menu-item {
            text-align: center;
        }

        .menu-icon {
            font-size: 25px;
        }

        .menu-item p {
            margin: 3px;
        }

    </style>
