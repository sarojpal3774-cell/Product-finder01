<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Hello, World!</title>

<body>
  <h1>
    <!DOCTYPE html>
<html>
<head>
    <title>TV</title>

    <style>
        body {
            background: #f2f2f2;
            font-family: Arial;
        }

        .tv {
            width: 300px;
            background: white;
            margin: 40px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #aaa;
        }

        .image {
            text-align: center;
            font-size: 90px;
            background: #eee;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #222;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .old {
            text-decoration: line-through;
            color: gray;
        }

        .offer {
            color: green;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="tv">

    <div class="image">📺</div>

    <h2>Samsung Smart TV</h2>

    <p>
        Smart LED TV with a clear display,
        powerful sound and streaming support.
    </p>

    <p>
        <b>Screen:</b> 55-inch<br>
        <b>Display:</b> 4K Ultra HD<br>
        <b>Type:</b> Smart LED TV<br>
        <b>Features:</b> Wi-Fi, YouTube, Netflix
    </p>

    <p class="offer">10% OFF</p>

    <span class="price">₹44,999</span>
    <span class="old">₹49,999</span>

    <button>Add to Cart 🛒</button>

</div>

</body>
</html>
  </h1>
</body>
</html>
