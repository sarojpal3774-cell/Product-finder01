<!DOCTYPE html>

  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">

  <h1>
    <!DOCTYPE html>
<html>
<head>
    <title>Mobile</title>

    <style>
        body {
            background: #f2f2f2;
            font-family: Arial;
        }

        .mobile {
            width: 300px;
            background: white;
            margin: 40px auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #aaa;
        }

        .image {
            text-align: center;
            font-size: 90px;
            background: #eee;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #222;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .old {
            text-decoration: line-through;
            color: gray;
        }

        .offer {
            color: green;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="mobile">

    <div class="image">📱</div>

    <h2>Samsung Galaxy A55</h2>

    <p>
        Stylish smartphone with a bright display,
        powerful performance and a great camera.
    </p>

    <p>
        <b>RAM:</b> 8GB<br>
        <b>Storage:</b> 128GB<br>
        <b>Display:</b> 6.6-inch AMOLED<br>
        <b>Camera:</b> 50MP
    </p>

    <p class="offer">10% OFF</p>

    <span class="price">₹29,999</span>
    <span class="old">₹33,999</span>

    <button>Add to Cart 🛒</button>

</div>

</body>
</html>
  </h1>
</body>
</html>
