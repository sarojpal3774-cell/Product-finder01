<!DOCTYPE html>
<html>
<head>
    <title>About Us</title>

    <style>
        body {
            background-color: aqua;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: black;
            font-size: 40px;
        }

        h2 {
            color: black;
            background-color: white;
            border: 2px solid red;
            border-radius: 10px;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            font-size: 18px;
        }

        h3 {
            font-size: 25px;
            color: black;
        }

        label {
            font-size: 18px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            margin-top: 8px;
            border: 2px solid black;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 35px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
        }
    </style>
</head>

<body>

    <h1>About</h1>

    <h2>
        This app helps you to find best products in low price.
        We are working on the app, so if you have any complaint
        or feedback, you can send a message with the help of
        given option below.
    </h2>

    <h3>Write your feedback</h3>

    <label for="name">Name</label>
    <br>
    <input id="name" type="text" placeholder="Write your name">

    <br><br>

    <label for="ph">Phone</label>
    <br>
    <input id="ph" type="tel" placeholder="Write your phone number">

    <br><br>

    <button type="submit">Submit</button>

</body>
</html>
